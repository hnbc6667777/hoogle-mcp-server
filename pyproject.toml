[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoogle-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for Hoogle (Haskell API search engine)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["mcp", "hoogle", "haskell", "api", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "mypy"]

[project.urls]
Homepage = "https://github.com/yourusername/hoogle-mcp-server"
Repository = "https://github.com/yourusername/hoogle-mcp-server"
Issues = "https://github.com/yourusername/hoogle-mcp-server/issues"

[project.scripts]
hoogle-mcp-server = "hoogle_mcp_server.main:main"